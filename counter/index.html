<style>
/* Layout: a counter tool for library staff. One column: the search box, then the verdict in big type (yes / maybe,
   compare / no), then the matching books as catalog cards whose left column reads like the spine label. Light by
   default for a desk PC under office light; the dark palette borrows the booth's night counter. */
:root{
  --bg:#FBF8F2; --panel:#F4EFE4; --line:#E2D8C3; --field:#FFFFFF;
  --ink:#1F2A30; --ink-2:#56626A; --pen:#284C6A;
  --lamp:#F3B562; --lamp-ink:#2B1B06; --amber-text:#8A5410; --maybe:#C98A2E;
  --no-bg:#F8E9E6; --no:#9A3B32;
  --f:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C24; --panel:#14262F; --line:#2C4754; --field:#1A303B;
    --ink:#E5ECE9; --ink-2:#AFC0C1; --pen:#9CC3E0;
    --lamp:#F3B562; --lamp-ink:#2B1B06; --amber-text:#F3B562; --maybe:#F3B562;
    --no-bg:#3A2321; --no:#F4B2A8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C24; --panel:#14262F; --line:#2C4754; --field:#1A303B;
  --ink:#E5ECE9; --ink-2:#AFC0C1; --pen:#9CC3E0;
  --lamp:#F3B562; --lamp-ink:#2B1B06; --amber-text:#F3B562; --maybe:#F3B562;
  --no-bg:#3A2321; --no:#F4B2A8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
.lib{margin:0;font-size:14px;letter-spacing:.16em;color:var(--ink-2)}
.lib b{font-weight:400;color:var(--amber-text)}
h1{margin:0;font-size:30px;font-weight:400;letter-spacing:.04em;line-height:1.3;text-wrap:balance}
.lead{margin:0;color:var(--ink-2);max-width:40em}
.search{display:flex;gap:10px}
.search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#q{flex:1;min-width:0;min-height:58px;padding:10px 16px;border:2px solid var(--pen);border-radius:12px;background:var(--field);color:var(--ink);font:inherit;font-size:22px;letter-spacing:.02em}
#q::placeholder{color:var(--ink-2);opacity:.8;font-size:17px}
#q:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
#clear{flex:none;min-width:72px;min-height:58px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
#clear:hover{border-color:var(--pen)}
#clear:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.answer{min-height:64px;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;font-size:20px;line-height:1.4}
.answer > svg{flex:none;width:30px;height:30px}
.answer small{display:block;margin-top:2px;font-size:15px;line-height:1.5}
.answer.yes{background:var(--lamp);color:var(--lamp-ink)}
.answer.maybe{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--maybe)}
.answer.maybe > svg{color:var(--maybe)}
.answer.no{background:var(--no-bg);color:var(--no)}
.answer.scan{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.answer.idle{display:block;background:var(--panel);color:var(--ink-2);font-size:16px}
.legend{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.legend li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.legend svg{width:22px;height:22px;margin-top:2px}
.legend b{font-weight:400;color:var(--ink)}
.i-yes{color:var(--amber-text)} .i-maybe{color:var(--maybe)} .i-no{color:var(--no)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 18px;padding:14px 18px;background:var(--panel);border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.call{font-size:17px;line-height:1.45;font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.call span{display:block}
.body{min-width:0}
.title{margin:0;font-size:19px;font-weight:700;line-height:1.4}
.by{margin:2px 0 0;font-size:15px;color:var(--ink-2)}
.meta{margin:4px 0 0;font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.meta a{color:var(--pen);text-underline-offset:3px}
.meta a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:2px}
.more{margin:0;font-size:15px;color:var(--ink-2)}
.foot{margin:10px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2);display:grid;gap:4px}
.foot p{margin:0}
@media (max-width:520px){.card{grid-template-columns:1fr}.call span{display:inline;margin-right:.5em}}
</style>
</head>

  <h1>Lucy 推薦書查詢</h1>
  <p class="lead">小攤裡的 1353 本書就是 Lucy 推薦書。可以直接刷書上的條碼，也可以打索書號、書名或作者，邊打邊比對。</p>
  <form class="search" id="search" role="search">
    <label for="q">條碼、索書號、書名或作者</label>
    <input id="q" type="text" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus placeholder="刷條碼，或打索書號、書名的前幾個字">
    <button id="clear" type="button">清除</button>
  </form>
  <div class="answer idle" id="answer" role="status" aria-live="polite"></div>
  <ol class="list" id="list"></ol>
  <p class="more" id="more" hidden></p>
  <div class="foot">
    <p>刷完一本，直接刷下一本就會換掉。索書號前面的 BC、K 和複本號 c.1 打不打都可以，空格和點也可以省略；一套多冊的書，每一冊都查得到。</p>
    <p>條碼清單是 2026-10-24 從館藏系統取得的，共 1018 個；之後才上架的複本如果刷不到，請改打書名或索書號。</p>
    <p>書單更新：2026-10-26・共 1353 本。這個頁面只用來查書，不會記錄任何查詢；按 Esc 可以清除重打。</p>
  </div>
</main>

58,"t":"瘋民宿","a":"谷聲圖書","y":2018,"c":"992.6233 8645 2018","b":[["TC006481","992.6233 8645 2018"]]},{"id":35352,"t":"跟著狗狗去旅行","a":"林歐加","y":2019,"c":"992.6233 8774 2019","b":[["TC007460","992.6233 8774 2019"]]},{"id":43517,"t":"郵輪環球周遊記","a":"周祝瑛","y":2025,"c":"992.75 8647 2025.3","b":[["TC010118","992.75 8647 2025.3"]]},{"id":43596,"t":"超輕量登山野營技巧","a":"麥克．克萊蘭","y":2024,"c":"992.77 8588 2024","b":[["TC010045","992.77 8588 2024"]]},{"id":31981,"t":"第一次親子露營好好玩","a":"歐韋伶","y":2018,"c":"992.78 8755 2018","b":[["C0010514","992.78 8755 2018"],["TC006519","992.78 8755 2018"]]},{"id":40685,"t":"每一次出發都有意義","a":"謝雪文","y":2023,"c":"992.8 8246 2023","b":[["TC008762","992.8 8246 2023"]]},{"id":33630,"t":"我永遠不無聊","a":"莎拉．戴弗斯","y":2019,"c":"999.9 8355 2019","b":[["TC007055","999.9 8355 2019"]]}]</script>
<script>
(function(){
  'use strict';
  var BOOKS = JSON.parse(document.getElementById('books').textContent), SHOW = 30;
  var CATALOG = 'https://library.show.org.tw/bookDetail/{id}?domain=5';
  var q = document.getElementById('q'), answer = document.getElementById('answer'), list = document.getElementById('list'), more = document.getElementById('more');
  var ICON = {
    yes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg>',
    maybe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.4a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4.1"/><path d="M12 17.6v.1"/></svg>',
    no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6v12M7.5 6v12M10.5 6v12M14 6v12M16.5 6v12M20 6v12"/></svg>'
  };
  var IDLE = '輸入後，這裡會出現三種結果之一：<ul class="legend">' +
    '<li><span class="i-yes">' + ICON.yes + '</span><span><b>是 Lucy 推薦書</b>：條碼、索書號或館藏頁號碼完全相符。</span></li>' +
    '<li><span class="i-maybe">' + ICON.maybe + '</span><span><b>找到可能相符的書</b>：請對照手上這本的書名和索書號。</span></li>' +
    '<li><span class="i-no">' + ICON.no + '</span><span><b>不是 Lucy 推薦書</b>：書單裡找不到。</span></li></ul>';

  /* Matching ignores spaces, dots and punctuation, full-width vs half-width, upper vs lower case and a few variant
     characters (臺/台). Call numbers also ignore the collection mark in front (BC, K…) and the copy number (c.1). */
  var VARIANT = {'臺':'台','裏':'裡','着':'著','爲':'為','羣':'群','峯':'峰','牀':'床','綫':'線','册':'冊','衆':'眾','温':'溫','汙':'污','啓':'啟','説':'說','黄':'黃','内':'內','户':'戶','别':'別','録':'錄','鷄':'雞','麪':'麵','画':'畫','擧':'舉'};
  var VARIANT_RE = new RegExp('[' + Object.keys(VARIANT).join('') + ']', 'g');
  var PUNCT = /[\s.,:;!?'"()\[\]{}<>\-‐-―_~·・‧•、，。．：；！？「」『』（）《》〈〉【】〔〕…\/\\|]/g;
  function half(s){
    s = String(s == null ? '' : s).replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/　/g, ' ');
    try { s = s.normalize('NFKC'); } catch (e) {}
    return s.toLowerCase().replace(VARIANT_RE, function(c){ return VARIANT[c]; });
  }
  function plain(s){ return half(s).replace(PUNCT, ''); }
  function callWords(s, lenient){
    s = half(s).replace(/\s+/g, ' ').trim();
    s = s.replace(/^(bwc|bc|mcd|k|m)(?=[\s\d])\s*/, '');            // collection mark on the spine
    s = s.replace(/\bvol\.?\s*(?=\d)/g, 'v.');
    s = s.replace(lenient ? /(^|\s)c\.?\s*\d+(?=\s|$)/g : /(^|\s)c\.\s*\d+(?=\s|$)/g, '$1');   // copy number
    return s.split(' ').map(function(w){ return w.replace(PUNCT, ''); }).filter(Boolean);
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var CODE = {};     // barcode -> the copy it is on
  BOOKS.forEach(function(b){
    b.labels = [b.c].concat(b.l || []);
    b.cores = []; b.tails = []; b.heads = [];
    b.labels.forEach(function(l){
      var w = callWords(l, false);
      b.cores.push(w.join(''));
      for (var i = 1; i < w.length; i++) b.tails.push(w.slice(i).join(''));
      if (w.length > 1) b.heads.push(w[0] + '|' + w[1]);     // class number + author number
    });
    b.tn = plain(b.t); b.an = plain(b.a);
    var vols = {};
    b.labels.forEach(function(l){ var m = /(?:^|\s)v\.\s*(\d+)/i.exec(l); if (m) vols[m[1]] = 1; });
    b.vols = Object.keys(vols).length;
    (b.b || []).forEach(function(x){ CODE[x[0]] = {b: b, label: x[1] || b.c, code: x[0], why: 'code'}; });
  });

  function codeKey(raw){
    var k = half(raw).replace(/\s+/g, '').toUpperCase();
    return /^\d{6}$/.test(k) ? 'TC' + k : k;     // the number alone, as some scanners send it
  }
  function find(raw){
    var hit = CODE[codeKey(raw)];
    if (hit) return {exact: [hit], near: [], kp: plain(raw)};
    var w2 = callWords(raw, true), k1 = callWords(raw, false).join(''), k2 = w2.join(''), kp = plain(raw);
    var head = w2.length > 1 ? w2[0] + '|' + w2[1] : '';
    var exact = [], near = [];
    BOOKS.forEach(function(b){
      var at = -1;
      if (k1) at = b.cores.indexOf(k1);
      if (at < 0 && k2) at = b.cores.indexOf(k2);
      if (at >= 0) { exact.push({b: b, label: b.labels[at], why: 'call'}); return; }
      if (kp && String(b.id) === kp) { exact.push({b: b, label: b.c, why: 'id'}); return; }
      var r = -1, hit = -1;
      if (k1) for (var i = 0; i < b.cores.length; i++) if (b.cores[i].indexOf(k1) === 0) { r = 1; hit = i; break; }
      if (r < 0 && kp && b.tn.indexOf(kp) === 0) r = 2;
      else if (r < 0 && kp && b.tn.indexOf(kp) > 0) r = 3;
      else if (r < 0 && kp && b.an.indexOf(kp) >= 0) r = 4;
      else if (r < 0 && k1.length >= 3 && /\d/.test(k1)) for (var j = 0; j < b.tails.length; j++) if (b.tails[j].indexOf(k1) === 0) { r = 5; break; }
      if (r < 0 && head && b.heads.indexOf(head) >= 0) r = 6;   // same class and author number, the rest differs
      if (r > 0) near.push({b: b, label: hit >= 0 ? b.labels[hit] : b.c, r: r});
    });
    near.sort(function(x, y){ return x.r - y.r || (x.b.c < y.b.c ? -1 : x.b.c > y.b.c ? 1 : 0); });
    return {exact: exact, near: near, kp: kp};
  }

  function card(h){
    var b = h.b, label = h.label.replace(/^(BWC|BC|MCD|K|M)\s+/i, '').replace(/\s+/g, ' ');
    var meta = [];
    if (h.code) meta.push('條碼 ' + esc(h.code));
    if (b.vols > 1) meta.push('共 ' + b.vols + ' 冊');
    meta.push('<a href="' + CATALOG.replace('{id}', encodeURIComponent(b.id)) + '" target="_blank" rel="noopener">館藏頁 ' + esc(b.id) + '</a>');
    return '<li class="card"><div class="call" aria-label="索書號 ' + esc(label) + '">' + label.split(' ').map(function(p){ return '<span>' + esc(p) + '</span>'; }).join('') + '</div>' +
      '<div class="body"><p class="title">' + esc(b.t) + '</p><p class="by">' + esc(b.a || '') + (b.y ? '・' + esc(b.y) : '') + '</p>' +
      '<p class="meta">' + meta.map(function(m){ return '<span>' + m + '</span>'; }).join('') + '</p></div></li>';
  }
  function say(kind, head, small){
    answer.className = 'answer ' + kind;
    answer.innerHTML = ICON[kind] + '<span>' + head + (small ? '<small>' + small + '</small>' : '') + '</span>';
  }
  function show(hits){
    list.innerHTML = hits.slice(0, SHOW).map(card).join('');
    more.hidden = hits.length <= SHOW;
    more.textContent = '還有 ' + (hits.length - SHOW) + ' 本沒列出，請多打幾個字或打完整的索書號。';
  }
  function run(){
    var raw = q.value.trim();
    if (!plain(raw)) { answer.className = 'answer idle'; answer.innerHTML = IDLE; list.innerHTML = ''; more.hidden = true; return; }
    var f = find(raw);
    if (f.exact.length) {
      var why = f.exact[0].why;
      say('yes', '是 Lucy 推薦書', why === 'code' ? '條碼相符。' : why === 'id' ? '館藏頁號碼相符。' :
        f.exact.length > 1 ? '這個索書號對到 ' + f.exact.length + ' 筆館藏，都在書單裡。' : '索書號完全相符。');
      show(f.exact); return;
    }
    if (f.near.length) {
      var sameHead = f.near.every(function(h){ return h.r === 6; });
      say('maybe', '找到 ' + f.near.length + ' 本可能相符的書', sameHead ?
        '類號和作者號一樣，後面的號碼不同，可能是同一位作者的另一本書，或同一套書的另一冊。請對照書名。' :
        '請對照手上這本的書名和索書號。');
      show(f.near); return;
    }
    // what a barcode scanner types: the library's label (letters then digits), or the ISBN on the back cover
    var k = codeKey(raw);
    if (/^(97[89]\d{10}|\d{9}[\dX])$/.test(k)) say('scan', '這是 ISBN，不是館藏條碼', '請改刷圖書館貼的條碼，或打書名、索書號。');
    else if (/^[A-Z]{1,4}\d{4,}$/.test(k)) say('no', '不是 Lucy 推薦書', '書單裡沒有條碼 ' + esc(k) + '。如果這本是最近才上架的複本，請改打書名或索書號再查一次。');
    else if (/^\d{5,}$/.test(k)) say('scan', '查不到這個號碼', '請刷圖書館貼的條碼，或打書名、索書號。');
    else say('no', '不是 Lucy 推薦書', '書單裡沒有「' + esc(raw) + '」。書名可以只打前幾個字再試一次。');
    show([]);
  }
  function reset(){ q.value = ''; run(); q.focus(); }
  q.addEventListener('input', run);
  // a scanner ends each barcode with Enter: keep the answer and select the text, so the next scan replaces it
  document.getElementById('search').addEventListener('submit', function(e){ e.preventDefault(); run(); q.select(); });
  document.getElementById('clear').addEventListener('click', reset);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' || e.key === 'Esc') reset(); });
  run();
})();
</script>
