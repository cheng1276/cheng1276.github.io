<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
:root{
  /* Layout: a clinic handout binder. Seven colour-coded index tabs stay pinned at the top;
     each disease is a single column of care cards: drawn pictogram tile, plain steps,
     and a small citation line under every step. */
  --paper:#f3f5f4;
  --sheet:#ffffff;
  --ink:#18211f;
  --ink-2:#4c5a57;
  --ink-3:#66736f;
  --rule:#d6dfdc;
  --brand:#0c6a5e;
  --brand-wash:#e0efea;
  --urgent:#a3241c;
  --urgent-wash:#fae7e4;
  --tip:#7a5200;
  --tip-wash:#fbf0d9;
  --no:#c0392b;
  --shadow:0 1px 2px rgb(24 40 36 / .05),0 8px 24px rgb(24 40 36 / .07);
  --f-display:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-body:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-latin:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-xs:.8125rem;
  --t-sm:.9375rem;
  --t-base:1.125rem;
  --t-card:1.375rem;
  --t-h2:1.875rem;
  --t-h1:2.5rem;
  /* disease hues (light) */
  --common:#0c6a5e; --common-ink:#0a4f46; --common-soft:#a9d6cb; --common-wash:#e0efea;
  --gout:#b35f00; --gout-ink:#7a4100; --gout-soft:#f2c992; --gout-wash:#fbeedd;
  --oa:#66751a; --oa-ink:#46520f; --oa-soft:#d3dd9f; --oa-wash:#f1f5dd;
  --osteoporosis:#7a6656; --osteoporosis-ink:#55463a; --osteoporosis-soft:#dccdc0; --osteoporosis-wash:#f4eee8;
  --urticaria:#b8395b; --urticaria-ink:#82243e; --urticaria-soft:#efb6c5; --urticaria-wash:#fae6ec;
  --ra:#2f5fb8; --ra-ink:#1f4285; --ra-soft:#b0c6ee; --ra-wash:#e6edfa;
  --axspa:#3d7f2a; --axspa-ink:#2a5a1c; --axspa-soft:#b7d9a8; --axspa-wash:#e7f2e1;
  --sle:#6c4cb8; --sle-ink:#4b3189; --sle-soft:#cbbbef; --sle-wash:#efe9fa;
  --sjogren:#0a7d9c; --sjogren-ink:#075a71; --sjogren-soft:#9fd6e6; --sjogren-wash:#dff1f6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101715; --sheet:#19211f; --ink:#e4ebe9; --ink-2:#a8b5b1; --ink-3:#8c9a96; --rule:#2c3835;
    --brand:#5cc7b1; --brand-wash:#16302b; --urgent:#ff9d93; --urgent-wash:#3a1916; --tip:#f1c56c; --tip-wash:#30270f; --no:#ff7b6b;
    --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .3);
    --common:#5cc7b1; --common-ink:#b4e6db; --common-soft:#2f6157; --common-wash:#15302a;
    --gout:#f0a64a; --gout-ink:#f8d6a8; --gout-soft:#6b4a1f; --gout-wash:#2e2214;
    --urticaria:#f08aa6; --urticaria-ink:#f9cbd8; --urticaria-soft:#6a3042; --urticaria-wash:#2f1820;
    --ra:#8aaaf0; --ra-ink:#cad8f8; --ra-soft:#33476f; --ra-wash:#172033;
    --axspa:#93cf7a; --axspa-ink:#cde9c1; --axspa-soft:#36592b; --axspa-wash:#182a14;
    --sle:#b6a0f2; --sle-ink:#ddd2fa; --sle-soft:#463a70; --sle-wash:#211b35;
    --sjogren:#62c7e2; --sjogren-ink:#b8e6f3; --sjogren-soft:#245562; --sjogren-wash:#12272d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101715; --sheet:#19211f; --ink:#e4ebe9; --ink-2:#a8b5b1; --ink-3:#8c9a96; --rule:#2c3835;
  --brand:#5cc7b1; --brand-wash:#16302b; --urgent:#ff9d93; --urgent-wash:#3a1916; --tip:#f1c56c; --tip-wash:#30270f; --no:#ff7b6b;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .3);
  --common:#5cc7b1; --common-ink:#b4e6db; --common-soft:#2f6157; --common-wash:#15302a;
  --gout:#f0a64a; --gout-ink:#f8d6a8; --gout-soft:#6b4a1f; --gout-wash:#2e2214;
  --urticaria:#f08aa6; --urticaria-ink:#f9cbd8; --urticaria-soft:#6a3042; --urticaria-wash:#2f1820;
  --ra:#8aaaf0; --ra-ink:#cad8f8; --ra-soft:#33476f; --ra-wash:#172033;
  --axspa:#93cf7a; --axspa-ink:#cde9c1; --axspa-soft:#36592b; --axspa-wash:#182a14;
  --sle:#b6a0f2; --sle-ink:#ddd2fa; --sle-soft:#463a70; --sle-wash:#211b35;
  --sjogren:#62c7e2; --sjogren-ink:#b8e6f3; --sjogren-soft:#245562; --sjogren-wash:#12272d;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:var(--t-base);line-height:1.7;
  padding-inline:16px;padding-block:0 3rem;-webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;font-weight:400;line-height:1.3;text-wrap:balance}
h1,h2,h3{font-family:var(--f-display)}
p{margin:0}
a{color:var(--brand);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:46rem;margin-inline:auto}

/* disease hue binding */
[data-d="common"]{--hue:var(--common);--hue-ink:var(--common-ink);--hue-soft:var(--common-soft);--hue-wash:var(--common-wash)}
[data-d="gout"]{--hue:var(--gout);--hue-ink:var(--gout-ink);--hue-soft:var(--gout-soft);--hue-wash:var(--gout-wash)}
[data-d="urticaria"]{--hue:var(--urticaria);--hue-ink:var(--urticaria-ink);--hue-soft:var(--urticaria-soft);--hue-wash:var(--urticaria-wash)}
[data-d="ra"]{--hue:var(--ra);--hue-ink:var(--ra-ink);--hue-soft:var(--ra-soft);--hue-wash:var(--ra-wash)}
[data-d="axspa"]{--hue:var(--axspa);--hue-ink:var(--axspa-ink);--hue-soft:var(--axspa-soft);--hue-wash:var(--axspa-wash)}
[data-d="sle"]{--hue:var(--sle);--hue-ink:var(--sle-ink);--hue-soft:var(--sle-soft);--hue-wash:var(--sle-wash)}
[data-d="sjogren"]{--hue:var(--sjogren);--hue-ink:var(--sjogren-ink);--hue-soft:var(--sjogren-soft);--hue-wash:var(--sjogren-wash)}
[data-d="oa"]{--hue:var(--oa);--hue-ink:var(--oa-ink);--hue-soft:var(--oa-soft);--hue-wash:var(--oa-wash)}
[data-d="osteoporosis"]{--hue:var(--osteoporosis);--hue-ink:var(--osteoporosis-ink);--hue-soft:var(--osteoporosis-soft);--hue-wash:var(--osteoporosis-wash)}

/* ---------- header ---------- */
.top{padding-block:2rem 1.25rem;display:grid;gap:.875rem}
.eyebrow{font-size:var(--t-sm);color:var(--brand);letter-spacing:.06em}
h1{font-size:var(--t-h1)}
.lead{color:var(--ink);max-width:34em}
.facts{display:flex;flex-wrap:wrap;gap:.375rem 1.25rem;font-size:var(--t-sm);color:var(--ink-2)}
.facts b{font-family:var(--f-latin);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;margin-right:.15em}
.legend{border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.legend summary{cursor:pointer;padding:.75rem 1rem;min-height:3rem;display:flex;align-items:center;font-size:var(--t-sm);font-weight:600}
.legend-body{padding:0 1rem 1rem;display:grid;gap:.5rem;font-size:var(--t-sm);color:var(--ink-2)}
.legend dl{margin:0;display:grid;gap:.375rem}
.legend dl div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:.75rem}
.legend dt{color:var(--ink);font-weight:600}
.legend dd{margin:0;min-width:0}

/* ---------- tabs ---------- */
.tabs{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  margin-inline:-16px;padding:.5rem 16px;background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.tablist{display:flex;gap:.375rem;overflow-x:auto;scrollbar-width:thin;max-width:46rem;margin-inline:auto;padding-bottom:2px}
.tab{
  flex:none;display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:.375rem .875rem;
  border:1.5px solid var(--rule);border-radius:999px;background:var(--sheet);cursor:pointer;
  font-family:var(--f-display);font-size:1rem;white-space:nowrap;color:var(--ink);
}
.tab::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--hue)}
.tab[aria-selected="true"]{background:var(--hue-wash);border-color:var(--hue);color:var(--hue-ink)}

/* ---------- disease panel ---------- */
.panel{padding-block:1.75rem 0;display:grid;gap:1.5rem}
.p-head{display:grid;gap:.625rem}
.p-kicker{font-size:var(--t-sm);color:var(--hue-ink);letter-spacing:.04em}
.p-head h2{font-size:var(--t-h2);color:var(--ink)}
.p-intro{color:var(--ink-2);max-width:36em}
.jump{display:flex;flex-wrap:wrap;gap:.375rem}
.jump button{border:0;background:var(--hue-wash);color:var(--hue-ink);border-radius:999px;padding:.3rem .75rem;min-height:2.25rem;font-size:var(--t-sm);cursor:pointer}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:1.25rem 1.125rem;display:grid;gap:1rem;min-width:0;scroll-margin-top:5rem}
.c-head{display:grid;grid-template-columns:5.25rem minmax(0,1fr);gap:1rem;align-items:center}
.pic{width:5.25rem;height:5.25rem;border-radius:18px;background:var(--hue-wash);display:grid;place-items:center}
.pic svg{width:4.25rem;height:4.25rem;display:block}
.pic .k{fill:none;stroke:var(--hue-ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.pic .kb{fill:none;stroke:var(--hue);stroke-width:7;stroke-linecap:round}
.pic .kw{fill:none;stroke:var(--sheet);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pic .w{fill:var(--sheet);stroke:var(--hue-ink);stroke-width:3.2;stroke-linejoin:round}
.pic .ts{fill:var(--hue-soft);stroke:var(--hue-ink);stroke-width:3.2;stroke-linejoin:round}
.pic .a{fill:var(--hue)}
.pic .t{fill:var(--hue-soft)}
.pic .wf{fill:var(--sheet)}
.pic .kf{fill:var(--hue-ink)}
.pic .n{fill:none;stroke:var(--no);stroke-width:4.5;stroke-linecap:round}
.pic .nf{fill:var(--no)}
.c-title{font-size:var(--t-card);color:var(--ink)}
.c-sum{color:var(--ink-2);font-size:var(--t-sm);margin-top:.25rem}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:.875rem}
.pt{display:grid;grid-template-columns:1.375rem minmax(0,1fr);gap:.5rem;align-items:start}
.pt::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--hue);margin:.68em 0 0 .3rem}
.pt-body{display:grid;gap:.2rem;min-width:0}
.cite{font-size:var(--t-xs);color:var(--ink-3);letter-spacing:.02em}
.tip{background:var(--tip-wash);border-radius:10px;padding:.75rem .875rem;display:grid;gap:.25rem}
.tip-l{font-size:var(--t-xs);font-weight:700;color:var(--tip);letter-spacing:.08em}
.tip p{font-size:1.0625rem}

.myths{display:grid;gap:.75rem}
.sec-h{font-size:1.375rem;display:flex;align-items:center;gap:.5rem}
.myth{border-left:4px solid var(--hue);background:var(--sheet);border-radius:0 12px 12px 0;padding:.875rem 1rem;display:grid;gap:.5rem;min-width:0}
.m-row{display:grid;grid-template-columns:4.25rem minmax(0,1fr);gap:.625rem;align-items:baseline}
.m-tag{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.m-tag.fact{color:var(--hue-ink)}
.m-belief{color:var(--ink-2)}
.seek{background:var(--urgent-wash);border-radius:14px;padding:1rem 1.125rem;display:grid;gap:.625rem}
.seek h3{color:var(--urgent);font-size:1.25rem;display:flex;align-items:center;gap:.5rem}
.seek h3::before{content:"!";flex:none;display:grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--urgent);color:var(--urgent-wash);font-family:var(--f-latin);font-size:.95rem;font-weight:700}
.seek ul{list-style:none;margin:0;padding:0;display:grid;gap:.625rem}
.seek li{display:grid;gap:.15rem}
.seek .cite{color:var(--ink-2)}

.refs{display:grid;gap:.625rem}
.refs ol{margin:0;padding-left:1.4em;display:grid;gap:.5rem;font-size:var(--t-sm);color:var(--ink-2)}
.refs li{overflow-wrap:anywhere}
.refs .r-short{color:var(--ink);font-weight:600}
.refs .r-links{display:inline-flex;gap:.75rem;margin-left:.25rem;font-family:var(--f-latin);font-size:var(--t-xs)}

/* review mode */
.ev,.notes{display:none}
.review .ev{display:grid;gap:.375rem;margin-top:.375rem;padding:.5rem .625rem;border-radius:8px;background:var(--paper);font-size:var(--t-xs);color:var(--ink-2)}
.review .notes{display:grid;gap:.5rem;padding:1rem 1.125rem;border:1.5px dashed var(--hue);border-radius:12px;background:var(--sheet);font-size:var(--t-sm)}
.notes h3{font-size:1.125rem;color:var(--hue-ink)}
.notes ul{margin:0;padding-left:1.2em;display:grid;gap:.375rem}
.ev-i{display:grid;gap:.1rem;min-width:0}
.ev-id{font-family:var(--f-latin);font-weight:600;color:var(--ink)}
.ev-q{font-family:var(--f-latin);overflow-wrap:anywhere;line-height:1.5}
.ev-ed{color:var(--tip);font-weight:600}
.badge-ed{display:none}
.review .badge-ed{display:inline-block;margin-left:.375rem;padding:0 .4rem;border-radius:4px;background:var(--tip-wash);color:var(--tip);font-size:var(--t-xs)}

/* footer */
.foot{margin-top:2.5rem;padding-block:1.75rem 1rem;border-top:1px solid var(--rule);display:grid;gap:1rem;font-size:var(--t-sm);color:var(--ink-2)}
.foot h2{font-size:1.25rem;color:var(--ink)}
.foot section{display:grid;gap:.5rem}
.foot ul{margin:0;padding-left:1.2em;display:grid;gap:.3rem}
.emerg{background:var(--urgent-wash);color:var(--urgent);border-radius:10px;padding:.75rem .875rem;font-weight:600}
.switch{display:flex;align-items:center;gap:.75rem;cursor:pointer;min-height:3rem;width:fit-content}
.switch input{width:1.25rem;height:1.25rem;accent-color:var(--brand)}
.meta{font-size:var(--t-xs);color:var(--ink-3)}

@media (min-width:640px){
  .card{padding:1.5rem 1.5rem}
  .c-head{grid-template-columns:6rem minmax(0,1fr)}
  .pic{width:6rem;height:6rem;border-radius:20px}
  .pic svg{width:4.75rem;height:4.75rem}
}
@media (prefers-reduced-motion:no-preference){
  .tab,.jump button{transition:background-color .15s ease,border-color .15s ease}
}

html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{padding:0;background:var(--paper);font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif}
.og{box-sizing:border-box;width:1200px;height:630px;padding:44px 72px;display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:center}
.og-e{font-size:30px;color:var(--brand);letter-spacing:.08em}
.og-t{font-size:104px;line-height:1.15;margin:14px 0 18px;color:var(--ink);font-weight:500}
.og-s{font-size:30px;color:var(--ink-2);line-height:1.5}
.og-pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.og-pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:var(--sheet);border:2px solid var(--rule);font-size:24px;color:var(--ink)}
.og-pill::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--hue)}
.og-x{font-size:24px;color:var(--ink-2);margin-top:18px}
.og-grid{display:grid;grid-template-columns:repeat(3,108px);gap:18px}
.og-grid .pic{width:108px;height:108px;border-radius:24px}
.og-grid .pic svg{width:84px;height:84px}

  const PLATE = (cx, cy, r) => `<circle class="w" cx="${cx}" cy="${cy}" r="${r}"/><circle class="k" cx="${cx}" cy="${cy}" r="${Math.round(r * 0.64)}"/>`;
