:root{
  /* Layout: a night-shift booth. A lit neon sign over one 560px column; the intake is three chip groups on a dark
     counter, and Lucy's prescription comes out as typed library catalog cards with her handwritten notes.
     One committed night look, so there is no light palette. */
  --night:#0E1C24;
  --counter:#14262F;
  --counter-2:#1A303B;
  --line:#2C4754;
  --chip-line:#52798C;   /* 3.3:1 against the counter, so every tappable chip shows its edge */
  --text:#E5ECE9;
  --text-2:#AFC0C1;   /* a little brighter for small text on the dark */
  --lamp:#F3B562;
  --lamp-soft:rgba(243,181,98,.16);
  --lamp-ink:#2B1B06;
  --paper:#F4EFE4;      /* cream, like an old catalog card */
  --paper-2:#EAE3D2;
  --ink:#1F2A30;
  --ink-2:#4F5D63;
  --pen:#284C6A;
  --rule:#BC4A3E;
  /* one rounded face (jf open 粉圓 / Huninn) for everything: sign, notes, labels and call numbers; only Lucy's
     signature under the note is handwritten (LucySign, above) */
  --f-ui:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",ui-rounded,system-ui,sans-serif;
  --f-sign:var(--f-ui);
  --f-hand:var(--f-ui);
  --f-type:var(--f-ui);
  --col:560px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background-color:var(--night);background-image:radial-gradient(120% 55% at 50% -12%, rgba(243,181,98,.13), transparent 62%);background-repeat:no-repeat;color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--lamp)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:calc(var(--col) + 32px);margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* the sign */
.sign{padding-block:28px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lib{font-size:13.5px;letter-spacing:.16em;color:var(--text-2)}
.tube{padding:14px 22px 16px;border:2px solid var(--lamp);border-radius:22px;box-shadow:0 0 0 1px rgba(243,181,98,.25),0 0 18px rgba(243,181,98,.35),inset 0 0 14px rgba(243,181,98,.22)}
.neon{font-family:var(--f-sign);font-weight:400;font-size:clamp(38px, 11.5vw, 60px);line-height:1.02;letter-spacing:.01em;color:#FFE6BF;text-shadow:0 0 2px #fff4e0,0 0 8px rgba(243,181,98,.9),0 0 22px rgba(243,181,98,.55),0 0 44px rgba(243,181,98,.3)}
.neon span{display:block}
.on .tube,.on .neon{animation:flicker 1.4s ease-out 1 both}
@keyframes flicker{0%{opacity:.15}8%{opacity:.9}11%{opacity:.25}17%{opacity:1}22%{opacity:.4}30%,100%{opacity:1}}
.zh-name{font-size:17px;letter-spacing:.3em;color:var(--text)}
.hours{font-size:14px;letter-spacing:.24em;color:var(--lamp)}
.intro{max-width:30em;font-size:15px;color:var(--text-2)}

/* intake: three questions on the counter */
.counter{background:var(--counter);border-block:1px solid var(--line)}
.intake{padding-block:22px 26px;display:flex;flex-direction:column;gap:22px}
.q{display:flex;flex-direction:column;gap:10px}
.ask{font-family:var(--f-hand);font-size:19px;line-height:1.5;color:var(--text)}
.ask b{font-family:var(--f-type);font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--lamp);margin-right:8px;vertical-align:2px}
.ask small{margin-left:8px;font-family:var(--f-ui);font-size:13.5px;color:var(--text-2);white-space:nowrap;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border:1.5px solid var(--chip-line);border-radius:999px;background:var(--counter-2);color:var(--text);font-size:15px;line-height:1.3;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--lamp)}
.chip[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.chip.dim{opacity:.45}
.energy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.energy .chip{border-radius:14px;padding:10px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.energy .chip small{font-size:13px;color:var(--text-2)}
.energy .chip[aria-pressed="true"] small{color:var(--lamp-ink)}
@media (max-width:420px){.energy{grid-template-columns:1fr}.energy .chip{flex-direction:row;align-items:baseline;gap:10px}}
.go{align-self:stretch;min-height:54px;border:0;border-radius:14px;background:var(--lamp);color:var(--lamp-ink);font-size:18px;font-weight:700;letter-spacing:.1em;cursor:pointer;box-shadow:0 0 22px rgba(243,181,98,.28)}
.go:hover{filter:brightness(1.05)}
.hint{min-height:1.3em;font-size:15px;color:var(--lamp);text-align:center}

/* care note */
.care{padding:14px 16px;border:1.5px solid var(--lamp);border-radius:14px;background:var(--lamp-soft);display:flex;flex-direction:column;gap:6px}
.care h3{font-size:16px;color:var(--lamp)}
.care p{font-size:15px;line-height:1.7}
.care .num{font-family:var(--f-type);font-weight:700;font-size:22px;letter-spacing:.06em;color:#FFE6BF}
.care .num a{color:inherit;text-decoration:none}
.care .more{font-size:14px;color:var(--text-2)}

/* the prescription */
.result{padding-block:26px 8px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:12px}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.result-head h2{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:400;letter-spacing:.06em}
.result-head .books{flex:none;filter:drop-shadow(0 0 4px rgba(243,181,98,.55))}
.badge{flex:none;font-family:var(--f-type);font-size:12px;font-weight:400;letter-spacing:.14em;color:var(--lamp);border:1px solid var(--lamp);border-radius:4px;padding:1px 7px}
.example-note{font-size:15px;color:var(--text-2)}
.slip{position:relative;align-self:flex-start;max-width:100%;padding:14px 18px 16px;background:var(--paper-2);color:var(--pen);border-radius:3px;transform:rotate(-.6deg);box-shadow:0 10px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px}
/* a strip of paper tape: Lucy left the note on the counter for you */
.slip::before{content:"";position:absolute;top:-11px;left:50%;width:78px;height:22px;margin-left:-39px;transform:rotate(-3deg);background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px),rgba(236,221,186,.82);box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
.slip-k{font-family:var(--f-type);font-size:12px;font-weight:400;letter-spacing:.12em;color:var(--ink-2);overflow-wrap:anywhere}
.slip-note{font-family:var(--f-hand);font-size:18px;line-height:1.75}
.sig{align-self:flex-end;font-family:"LucySign",var(--f-hand);font-size:24px;line-height:1.2}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.card{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr);gap:0 14px;padding:16px 16px 30px;background:var(--paper);color:var(--ink);border-radius:3px;box-shadow:0 1px 0 #d6ccb8,0 12px 26px rgba(0,0,0,.32)}
.show .card{animation:pull .5s cubic-bezier(.2,.9,.3,1) both}
.show .card:nth-child(2){animation-delay:.08s}
.show .card:nth-child(3){animation-delay:.16s}
@keyframes pull{from{transform:translateY(18px);opacity:.3}to{transform:none;opacity:1}}
.call{font-family:var(--f-type);font-size:13px;line-height:1.4;color:var(--ink);padding-top:2px;overflow-wrap:anywhere}
.call span{display:block}
.entry{min-width:0;display:flex;flex-direction:column;gap:3px}
.entry .au{font-family:var(--f-type);font-size:13px;color:var(--ink-2)}
.entry .au .nm{display:inline-block;max-width:100%;overflow-wrap:anywhere}
.entry h3{font-size:18px;line-height:1.45;font-weight:700;overflow-wrap:anywhere}
.entry .pub{font-size:12.5px;color:var(--ink-2)}
.rule{grid-column:1 / -1;height:0;border-top:1.5px solid var(--rule);margin:10px 0 10px}
.note{grid-column:1 / -1;font-family:var(--f-hand);font-size:17px;line-height:1.7;color:var(--pen)}
.meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.meta .fmt{font-family:var(--f-type);font-weight:400;color:var(--ink)}
.card a{grid-column:1 / -1;justify-self:start;margin-top:10px;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px;border:1.5px solid var(--ink);border-radius:8px;color:var(--ink);font-size:14px;text-decoration:none}
.card a:hover{background:var(--paper-2)}
.hole{position:absolute;left:50%;bottom:9px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--counter);box-shadow:inset 0 1px 2px rgba(0,0,0,.55),0 0 0 1px rgba(31,42,48,.12)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.borrow-hint{margin:12px 2px 0;font-size:15px;line-height:1.6;color:var(--text-2)}

  var BOOKS_ICON = '<svg class="books" viewBox="0 0 30 26" width="30" height="26" aria-hidden="true" focusable="false"> <g fill="none" stroke="#F3B562" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"> <rect x="3" y="18.5" width="24" height="5.5" rx="1.6"/><rect x="6" y="12.5" width="19" height="5.5" rx="1.6"/> <rect x="4.5" y="6" width="21" height="5.5" rx="1.6" transform="rotate(-6 15 8.75)"/> <path d="M7 18.5v5.5M21.5 12.5v5.5M9 6.3v5.2" transform="translate(0 0)"/></g></svg>';
  function freshSalt(){ try { var a = new Uint32Array(2); crypto.getRandomValues(a); return a[0].toString(36) + a[1].toString(36); } catch (e) { return Math.random().toString(36).slice(2); } }
  var state = { moods: [], thoughts: [], energy: 0, round: 0, shown: [], example: true, salt: freshSalt() };
  var LABEL = {};
  (DATA.moods || []).forEach(function(m){ LABEL[m.id] = m.label; });
  (DATA.thoughts || []).forEach(function(t){ LABEL[t.id] = t.label; });
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  // FNV-1a and then a final mix (murmur3's finaliser), so keys that differ only in their last character (book ids
  // 37123 and 37124, or the first and second pick) still get unrelated numbers
  function hash(str){
    var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function key(sel){ return sel.moods.join(',') + '|' + sel.thoughts.join(',') + '|' + sel.energy; }
  function pick(list, seed){ if (!list || !list.length) return ''; return list[Math.floor(hash(seed) * list.length) % list.length]; }

  /* ---------- the intake ---------- */
  function chip(kind, item){
    var on = state[kind].indexOf(item.id) >= 0, full = !on && state[kind].length >= MAX;
    return '<button type="button" class="chip' + (full ? ' dim' : '') + '" data-kind="' + kind + '" data-id="' + esc(item.id) + '" aria-pressed="' + on + '"' + (full ? ' aria-disabled="true"' : '') + '>' + esc(item.label) + '</button>';
  }
  function renderIntake(){
    $('moods').innerHTML = DATA.moods.map(function(m){ return chip('moods', m); }).join('');
    $('thoughts').innerHTML = DATA.thoughts.map(function(t){ return chip('thoughts', t); }).join('');
    $('energy').innerHTML = DATA.energies.map(function(e){
      return '<button type="button" class="chip" data-kind="energy" data-id="' + e.id + '" aria-pressed="' + (state.energy === e.id) + '">' + esc(e.label) + '<small>' + esc(e.hint) + '</small></button>';
    }).join('');
  }
  function careHtml(){
    var c = DATA.care;
    return '<h3>' + esc(c.title) + '</h3>' +
      '<p>' + esc(c.body) + '</p>' +
      '<p class="num"><a href="tel:' + esc(c.number) + '">' + esc(c.number) + '</a> <span style="font-family:var(--f-ui);font-size:14px;font-weight:400;letter-spacing:0">' + esc(c.numberLabel) + '</span></p>' +
      '<p class="more">' + esc(c.more) + '</p>';
  }

  /* ---------- matching ---------- */
  // 先分組，再抽籤. The books that fit best form a group: the same moods and thoughts matched and a reading effort that
  // fits as well. Each book is then drawn from that group by lot; a stronger book (w) has better odds but none is
  // certain, so readers who pick the same feelings get different books. The next group is reached only when the best
  // one runs out.
  var ODDS = { 1: 1, 2: 2, 3: 3 };   // w 3 (excellent, widely loved) has three times the chance of w 1 (acceptable, niche)
  function scoreAll(sel, seedSalt){
    var moods = sel.moods, seed = key(sel) + '#' + seedSalt;
    var wantsLaugh = sel.moods.indexOf('laugh') >= 0 && sel.moods.indexOf('grief') < 0;
    // books that touch on suicide, self-harm or abuse are kept away from anyone who picked a heavy mood
    var heavy = sel.moods.some(function(m){ return HEAVY.indexOf(m) >= 0; });
    var books = heavy ? DATA.books.filter(function(b){ return !b.x; }) : DATA.books;
    return books.map(function(b){
      var s = 0, hits = [], odds = ODDS[b.w] || 2;
      moods.forEach(function(m){ if (b.m.indexOf(m) >= 0) { s += 3; if (LABEL[m] && hits.indexOf(LABEL[m]) < 0) hits.push(LABEL[m]); } });
      sel.thoughts.forEach(function(t){ if (b.h.indexOf(t) >= 0) { s += 4; hits.push(LABEL[t]); } });
      if (sel.energy) { var d = Math.abs(b.e - sel.energy); s += d === 0 ? 2 : (d === 1 ? 0.5 : -1.5); }
      // someone who only wants a laugh gets the purely funny books before the funny-but-sad ones
      if (wantsLaugh && b.m.indexOf('grief') >= 0) s -= 2;
      // warm first: on a heavy day a bittersweet book (real sadness, but comforting) is held back to a later group and a
      // funny one has better odds; on other days a bittersweet book only has slightly lower odds
      var held = false;
      if (b.d) { if (heavy) { s -= 1.0; held = true; } else odds *= 0.75; }
      if (heavy && b.m.indexOf('laugh') >= 0) odds *= 1.3;
      return { b: b, s: s, odds: odds, held: held, seed: seed + ':' + b.id, hits: hits };
    }).sort(function(x, y){ return y.s - x.s; });
  }
  function choose(ranked, exclude){
    var pool = ranked.filter(function(r){ return exclude.indexOf(r.b.id) < 0; });
    var matched = pool.filter(function(r){ return r.hits.length; });
    var src = matched.length >= 3 ? matched : matched.concat(pool.filter(function(r){ return !r.hits.length; }));
    var picked = [], fmtCount = {};
    while (picked.length < 3 && src.length) {
      // the group: every book within 0.9 of the best fit still left (a tag not matched, a reading effort one step off,
      // or a bittersweet book on a heavy day each puts a book in a later group)
      var top = -Infinity;
      src.forEach(function(r){ if (r.s > top) top = r.s; });
      var group = src.filter(function(r){ return r.s >= top - 0.9; });
      // warm first, but not down to a handful: while fewer than 12 warm books fit this well, the held-back bittersweet
      // books that fit just as well join the draw and share the rest of the chances ((12 - n) / 12). Someone who misses
      // a person who died would otherwise meet the same few books, since most books about loss are bittersweet.
      var fill = 0;
      if (group.length < 12 && !group.some(function(r){ return r.held; })) {
        var heldBack = src.filter(function(r){ return r.held && r.s < top - 0.9 && r.s + 1.0 >= top - 0.9; });
        if (heldBack.length) {
          var w0 = 0, w1 = 0;
          group.forEach(function(r){ w0 += r.odds; });
          heldBack.forEach(function(r){ w1 += r.odds; });
          fill = (12 - group.length) / group.length * w0 / w1;
          group = group.concat(heldBack);
        }
      }
      // three different kinds of book when the group can offer it: only while at least five books of a kind not yet
      // picked are left, so a lone book of an unusual kind does not become a fixture for everyone
      if (picked.length) {
        var fresh = group.filter(function(r){ return !fmtCount[r.b.f]; });
        if (fresh.length >= 5) group = fresh;
      }
      // the lot: a weighted draw (largest u^(1/odds) wins, with a fresh u for every book at every pick); a kind of
      // book already in the list keeps about a third of its odds
      var best = null, bestKey = -Infinity, n = picked.length;
      group.forEach(function(r){
        var odds = r.odds * (fill && r.held ? fill : 1) * Math.pow(0.35, fmtCount[r.b.f] || 0);
        var k = Math.log(Math.max(hash(r.seed + '/' + n), 1e-12)) / odds;
        if (k > bestKey) { bestKey = k; best = r; }
      });
      src.splice(src.indexOf(best), 1);
      picked.push(best); fmtCount[best.b.f] = (fmtCount[best.b.f] || 0) + 1;
    }
    return picked;
  }

  /* ---------- Lucy's note ---------- */
  function composeNote(sel){
    // the note is drawn once per press of 請 Lucy 開書單 (state.salt) and stays put while 再換三本 changes the books
    var L = DATA.lines, seed = key(sel) + '#' + state.salt, parts = [];
    if (sel.moods.length) parts.push(pick(L.mood[sel.moods[0]], seed + 'm'));
    sel.thoughts.slice(0, 2).forEach(function(t, i){ parts.push(pick(L.thought[t], seed + 't' + i)); });
    parts.push(pick(L.energy[String(sel.energy || 0)], seed + 'e'));
    return parts.join('');
  }
  function summary(sel){
    var a = [];
    if (sel.moods.length) a.push('今天的你：' + sel.moods.map(function(m){ return LABEL[m]; }).join('、'));
    if (sel.thoughts.length) a.push('心裡想著：' + sel.thoughts.map(function(t){ return LABEL[t]; }).join('、'));
    return a.join('｜');
  }

  /* ---------- the prescription ---------- */
  // keep each name whole: a line may break between two authors, never inside a name
  function authorHtml(a){ var names = String(a || '').split('、'); return names.map(function(n, i){ return '<span class="nm">' + esc(n) + (i < names.length - 1 ? '、' : '') + '</span>'; }).join(''); }
  function callHtml(call){ return String(call || '').split(/\s+/).filter(Boolean).map(function(p){ return '<span>' + esc(p) + '</span>'; }).join(''); }
  function cardHtml(r){
    var b = r.b, fmt = DATA.formats[b.f] || { label: '', time: '' };
    var url = DATA.detail.replace('{id}', encodeURIComponent(b.id));
    return '<li class="card">' +
      '<div class="call" aria-label="索書號 ' + esc(b.c) + '">' + callHtml(b.c) + '</div>' +
      '<div class="entry"><span class="au">' + authorHtml(b.a) + '</span><h3>' + esc(b.t) + '</h3>' +
        '<span class="pub">' + esc([b.y, b.s].filter(Boolean).join('・')) + '</span></div>' +
      '<div class="rule" aria-hidden="true"></div>' +
      '<p class="note">' + esc(b.n) + '</p>' +
      '<p class="meta"><span class="fmt">' + esc(fmt.label + (fmt.time ? '・' + fmt.time : '')) + '</span>' +
        '</p>' +
      '<a href="' + esc(url) + '" target="_blank" rel="noopener">在館藏系統看是否在架 ↗</a>' +
      '<span class="hole" aria-hidden="true"></span>' +
    '</li>';
  }
  function current(){ return state.example ? DATA.example : { moods: state.moods.slice(), thoughts: state.thoughts.slice(), energy: state.energy }; }
  function renderResult(animate, notice){
    var sel = current();
    var ranked = scoreAll(sel, state.salt + ':' + state.round);
    var picked = choose(ranked, state.shown);
    if (picked.length < 3 && state.shown.length) { state.shown = []; notice = DATA.lines.loop; picked = choose(ranked, []); }
    picked.forEach(function(r){ state.shown.push(r.b.id); });
    state.picked = picked.map(function(r){ return r.b; });
    var html = '<div class="result-head"><h2 id="rx-title" tabindex="-1">' + BOOKS_ICON + 'Lucy 的書單</h2>' + (state.example ? '<span class="badge">範例</span>' : '') + '</div>';
    if (state.example) html += '<p class="example-note">' + esc(DATA.lines.example) + '</p>';
    html += '<article class="slip"><p class="slip-k">' + esc(summary(sel)) + '</p><p class="slip-note">' + esc(composeNote(sel)) + '</p><p class="sig">— Lucy</p></article>';
    if (notice) html += '<p class="example-note">' + esc(notice) + '</p>';
    html += '<ol class="cards">' + picked.map(cardHtml).join('') + '</ol>';
    html += '<div class="actions"><button type="button" class="btn" data-act="more">再換三本</button>' +
      (state.example ? '' : '<button type="button" class="btn" data-act="share">分享書單</button><button type="button" class="btn quiet" data-act="again">重新選</button>') + '</div>';
    if (!state.example) html += '<div class="share-box" id="share-box" hidden><p class="share-msg" role="status"></p><textarea readonly aria-label="書單文字"></textarea></div>';
    if (!state.example) html += '<p class="borrow-hint">' + esc(DATA.lines.borrow) + '</p>';
    var box = $('result');
    box.classList.remove('show'); box.innerHTML = html;
    if (animate) { void box.offsetWidth; box.classList.add('show'); }
  }

  /* ---------- events ---------- */
  function runGo(){
    if (!state.moods.length && !state.thoughts.length) { $('go-msg').textContent = DATA.lines.empty; return; }
    $('go-msg').textContent = '';
    state.example = false; state.round = 0; state.shown = []; state.salt = freshSalt();
    renderResult(true);
    $('result').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    var h = $('rx-title'); if (h) h.focus({ preventScroll: true });
  }

  /* ---------- 分享書單: the three books and their call numbers, never the moods ---------- */
  function shareText(){
    var lines = [DATA.share.title];
    (state.picked || []).forEach(function(b, i){
      lines.push((i + 1) + '.《' + b.t + '》' + (b.a || ''));
      lines.push('   索書號 ' + b.c + (b.s ? '（' + b.s + '）' : ''));
    });
    lines.push('', DATA.share.more, DATA.siteUrl);
    return lines.join('\n');
  }
  function showShareBox(text, copied){
    var box = $('share-box'); if (!box) return;
    box.hidden = false;
    box.querySelector('.share-msg').textContent = copied ? DATA.share.copied : DATA.share.manual;
    var ta = box.querySelector('textarea'); ta.value = text;
    if (!copied) { ta.focus(); ta.select(); }
  }
  function copyText(text){
    try {
      navigator.clipboard.writeText(text).then(function(){ showShareBox(text, true); }, function(){ showShareBox(text, false); });
    } catch (e) { showShareBox(text, false); }
  }
  function shareList(){
    var text = shareText();
    if (navigator.share) {
      navigator.share({ title: DATA.share.title, text: text }).catch(function(err){ if (!err || err.name !== 'AbortError') copyText(text); });
    } else {
      copyText(text);
    }
  }

  /* ---------- floating button: once something is picked, while the real button is still below the screen ---------- */
  var goBelow = false;
  function updateDock(){
    $('dock').hidden = !((state.moods.length || state.thoughts.length) && goBelow);
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){
      var en = es[es.length - 1];
      goBelow = !en.isIntersecting && en.boundingClientRect.top > 0;   // above the screen (reading results, footer) = no dock
      updateDock();
    }).observe($('go'));
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-kind],[data-act],#go'); if (!el) return;
    var act = el.getAttribute('data-act');
    if (el.id === 'go' || act === 'go') { runGo(); return; }
    if (act === 'more') { state.round++; renderResult(true); return; }
    if (act === 'share') { shareList(); return; }
    if (act === 'again') { state.moods = []; state.thoughts = []; state.energy = 0; renderIntake(); updateDock(); $('sign').scrollIntoView({ block: 'start' }); return; }
    var kind = el.getAttribute('data-kind'), id = el.getAttribute('data-id');
    if (kind === 'energy') { var n = parseInt(id, 10); state.energy = state.energy === n ? 0 : n; renderIntake(); return; }
    var list = state[kind], at = list.indexOf(id);
    if (at >= 0) list.splice(at, 1);
    else if (list.length < MAX) list.push(id);
    else { $('go-msg').textContent = DATA.lines.full; return; }
    $('go-msg').textContent = '';
    renderIntake();
    updateDock();
    var again = document.querySelector('[data-kind="' + kind + '"][data-id="' + id + '"]'); if (again) again.focus();
  });

  /* ---------- boot ---------- */
  $('lib-name').textContent = DATA.lib;
  $('care-foot').innerHTML = careHtml();
  $('about').textContent = DATA.about;
  $('links').innerHTML = DATA.links.map(function(l){ return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>'; }).join('');
  renderIntake();
  renderResult(false);
  requestAnimationFrame(function(){ $('sign').classList.add('on'); });
})();
</script>

</body>
</html>
