<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>神秘處方書</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="rx-css">
/* Layout: a pharmacy counter (cool grey-blue ground) under one white header band; content sits in a single
   520px column. Each prescription is a printed medicine bag: one spot colour, a ruled field table, a red stamp.
   Single committed light look (paper bag), so no dark palette. */
:root{
  --counter:#E9EEF4;
  --paper:#FFFFFF;
  --paper-2:#F3F6FA;
  --ink:#18233A;
  --ink-2:#56627A;
  --ink-3:#7B879B;
  --rule:#D5DDE8;
  --rule-2:#C3CEDC;
  --field:#B8C3D3;
  --spot:#1F5FAF;
  --spot-tint:#EEF3FA;
  --spot-tint-2:#F5F8FC;
  --stamp:#C8372D;
  --ok:#1C6B3D;
  --ok-bg:#E5F3EA;
  --bad:#B42318;
  --fb:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --col:520px;
  color-scheme:light;
}
@supports (background: color-mix(in srgb, red 50%, white)){
  :root{--spot-tint:color-mix(in srgb, var(--spot) 7%, #FFFFFF);--spot-tint-2:color-mix(in srgb, var(--spot) 4%, #FFFFFF)}
}
*{box-sizing:border-box}
html{background:var(--counter)}
body{margin:0;background:var(--counter);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--spot)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--fm)}
:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.wrap{max-width:calc(var(--col) + 32px);margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* header band */
.band{background:var(--paper);border-bottom:1px solid var(--rule)}
.head{padding-block:20px 18px;display:flex;flex-direction:column;gap:6px}
.head-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lib{font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--ink-2)}
.tag{flex:none;font-size:12px;font-weight:700;letter-spacing:.12em;color:#FFFFFF;background:var(--spot);padding:4px 10px;border-radius:999px}
.head h1{margin-top:6px;font-size:34px;line-height:1.15;font-weight:900;letter-spacing:.04em}
.head .sub{font-size:14px;color:var(--ink-2)}
.sample{margin-top:8px;font-size:13px;color:#6E4700;background:#FFF4D6;border:1px solid #EFD39A;border-radius:8px;padding:8px 12px}

.main{display:flex;flex-direction:column;gap:14px;padding-block:16px 0}

/* progress */
.progress{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.progress .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.progress .k{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}
.progress .n{font-family:var(--fm);font-size:30px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.progress .n small{font-size:18px;color:var(--ink-3)}
.progress .s{font-size:13px;color:var(--ink-2)}
.caps{flex:none;display:flex;align-items:center;gap:2px}
.caps.many{flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.cap{display:block;transform:rotate(-35deg)}
.cap .half{fill:var(--spot)}
.cap .half2{fill:var(--spot-tint)}
.cap .shell{fill:none;stroke:var(--spot);stroke-width:2}
.cap .mid{stroke:var(--spot);stroke-width:2}
.cap.off .shell,.cap.off .mid{stroke:var(--field)}

/* waiting room: queue tickets */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px}
.sec-head h2{font-size:18px;font-weight:700}
.sec-head span{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--ink-2)}
.lead{font-size:14px;line-height:1.7;color:var(--ink-2)}
.tickets{display:flex;flex-direction:column;gap:10px}
.ticket{display:grid;grid-template-columns:62px minmax(0,1fr) 78px;align-items:stretch;min-height:76px;width:100%;padding:0;margin:0;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden;cursor:pointer;color:var(--ink)}
.ticket:hover{border-color:var(--rule-2);box-shadow:0 4px 14px rgba(24,35,58,.08)}
.tno{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-right:1.5px dashed var(--rule-2);background:var(--spot-tint);color:var(--spot);font-family:var(--fm)}
.tno small{font-size:10px;font-weight:500;letter-spacing:.16em}
.tno b{font-size:22px;font-weight:600;line-height:1.1}
.ticket .sym{align-self:center;padding:12px 6px 12px 14px;font-size:15px;line-height:1.5;font-weight:500;min-width:0;overflow-wrap:anywhere}
.ticket .st{display:flex;align-items:center;justify-content:center;padding-right:8px}
.go{display:inline-flex;align-items:center;gap:1px;padding:5px 7px 5px 11px;border:1.5px solid var(--spot);border-radius:999px;color:var(--spot);font-size:13px;font-weight:700;white-space:nowrap}
.mini-stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;border:2px solid var(--stamp);color:var(--stamp);transform:rotate(-12deg);font-size:12px;font-weight:900;line-height:1.15}
.mini-stamp small{font-family:var(--fm);font-size:9px;font-weight:600}
.note{font-size:13px;line-height:1.7;color:var(--ink-2)}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;padding-block:26px 32px;font-size:13px}
.foot a,.foot button{color:var(--ink-2);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.foot .reset-q{color:var(--ink);font-weight:700}

/* first visit: registration slip */
.reg{background:var(--paper);border:1.5px solid var(--spot);border-radius:12px;overflow:hidden}
.reg-band{background:var(--spot);color:#FFFFFF;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.reg-band b{font-size:19px;font-weight:900;letter-spacing:.14em}
.reg-band span{font-size:12px;letter-spacing:.06em}
.reg-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.reg-body label{font-size:13px;font-weight:700;color:var(--ink-2)}
.reg-help{font-size:13px;line-height:1.7;color:var(--ink-2)}
.reg-confirm{font-size:15px}
.reg-confirm b{font-size:24px;font-weight:900;letter-spacing:.04em;overflow-wrap:anywhere}
.reg-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reg-actions .btn-go{padding:0 18px}
.reg-actions .btn-out{align-self:auto;cursor:pointer}

/* prescription: the medicine bag */
.topnav{display:flex;justify-content:space-between;align-items:center;padding-block:8px 4px}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0;background:none;border:0;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.topnav .mono{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--ink-2)}
.rxmain{gap:0;padding-top:4px}
.okbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-size:14px;font-weight:700}
.bag{position:relative;background:var(--paper);border-radius:4px 4px 14px 14px;box-shadow:0 1px 0 #CDD6E2,0 12px 28px rgba(24,35,58,.10);overflow:hidden}
.fold{height:14px;background:var(--paper-2);border-bottom:1.5px dashed var(--rule-2)}
.bag-band{background:var(--spot);color:#FFFFFF;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bag-band .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.bag-band .who span{font-size:12px;font-weight:500;letter-spacing:.08em}
.bag-band .who b{font-size:21px;font-weight:900;letter-spacing:.14em}
.use{flex:none;border:2px solid #FFFFFF;border-radius:6px;padding:4px 10px;font-size:18px;font-weight:900;letter-spacing:.12em}
.bag-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.bag-info div{padding:10px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bag-info div+div{border-left:1px solid var(--rule)}
.bag-info .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-2)}
.bag-info .v{font-size:14px;font-weight:600;line-height:1.5}
.bag-info .v.mono{font-size:18px}
.bag-info .v.name{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.bag-info div.wide{grid-column:1 / -1;border-left:0;border-top:1px solid var(--rule)}
.fields{margin:0}
.fields .r{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr);border-bottom:1px solid var(--rule)}
.fields dt{padding:12px 8px 12px 16px;background:var(--spot-tint);color:var(--spot);font-size:12px;font-weight:700;letter-spacing:.06em;line-height:1.7}
.fields dd{margin:0;padding:10px 16px 10px 14px;font-size:15px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.fields .r.main dd{padding-block:12px;font-size:17px;font-weight:700;line-height:1.55}
.fields dd.drug{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:12px}
.fields dd.drug b{font-size:16px;font-weight:700}
.hatch{padding:3px 8px;border-radius:4px;background:repeating-linear-gradient(45deg,#EEF2F7 0 5px,#E1E7EF 5px 10px);font-size:12px;font-weight:500;color:var(--ink-2)}
.fields dd.got{display:flex;flex-direction:column;gap:2px;padding:12px 122px 14px 14px}
.fields dd.got b{font-size:22px;font-weight:900;line-height:1.35;letter-spacing:.02em}
.fields dd.got span.au{font-size:13px;color:var(--ink-2)}
.stamp{position:absolute;right:14px;top:50%;width:104px;height:104px;margin-top:-52px;border-radius:50%;border:3px double var(--stamp);color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotate(-14deg);opacity:.9;font-size:19px;font-weight:900;letter-spacing:.1em;line-height:1.2;pointer-events:none;animation:stamp .45s cubic-bezier(.2,1.4,.4,1) both}
.stamp small{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.02em}
@keyframes stamp{from{transform:rotate(-14deg) scale(1.6);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.9}}
.pickup{margin:16px;padding:14px;border:1.5px solid var(--spot);border-radius:10px;background:var(--spot-tint-2);display:flex;flex-direction:column;gap:10px}
.pickup .k,.pickinfo .k{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--spot)}
.pickup p{font-size:14px;line-height:1.7}
.pickup form{display:flex;flex-direction:column;gap:8px}
.pickup label{font-size:13px;font-weight:500;color:var(--ink-2)}
.btn-out{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid var(--spot);border-radius:8px;background:#FFFFFF;color:var(--spot);font-size:14px;font-weight:700;text-decoration:none}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;height:48px;padding:0 12px;border:1.5px solid var(--field);border-radius:8px;background:#FFFFFF;font:inherit;font-size:16px;color:var(--ink)}
.inrow input.code{font-family:var(--fm);letter-spacing:.12em;text-transform:uppercase}
.btn-go{flex:none;min-width:88px;height:48px;border:0;border-radius:8px;background:var(--spot);color:#FFFFFF;font-size:16px;font-weight:700;letter-spacing:.12em;cursor:pointer}
.msg{font-size:13.5px;min-height:1.2em}
.msg.bad{color:var(--bad)}
.msg.good{color:var(--ok)}
.pickinfo{margin:16px;padding:14px;border-radius:10px;background:var(--spot-tint);display:flex;flex-direction:column;gap:10px}
.pickinfo dl{margin:0;display:grid;grid-template-columns:60px minmax(0,1fr);row-gap:4px;font-size:14px;line-height:1.7}
.pickinfo dt{color:var(--ink-2)}
.pickinfo dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pickinfo dd.mono{font-weight:600}
.pickinfo .note2{font-size:13px;line-height:1.7;color:var(--ink-2)}
.btn-main{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:8px;background:var(--spot);color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none}
.btn-main:hover{color:#FFFFFF;filter:brightness(.94)}
.bag-foot{padding:12px 16px 16px;border-top:1.5px dashed var(--rule-2);display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink-2)}
.after{margin-top:14px;font-size:12px;text-align:center;color:var(--ink-2)}
.pill-btn{align-self:center;margin-top:16px;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;font-size:14px;font-weight:700;color:var(--ink);border:1.5px solid var(--field);border-radius:999px;background:#FFFFFF;cursor:pointer}

/* certificate */
.cert{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:0 12px 28px rgba(24,35,58,.10)}
.cert-band{background:var(--spot);color:#FFFFFF;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.cert-band span{font-size:12px;letter-spacing:.08em}
.cert-band b{font-size:22px;font-weight:900;letter-spacing:.16em}
.cert-body{position:relative;padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}
.cert-body > p{font-size:14px}
.cert-name{display:flex;flex-direction:column;gap:2px;min-height:96px;padding-right:112px}
.cert-name .k{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-2)}
.cert-name b{font-size:28px;font-weight:900;line-height:1.25;letter-spacing:.06em;overflow-wrap:anywhere}
.cert-name span.when{font-size:12.5px;color:var(--ink-2)}
.live{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--spot-tint);font-size:13px;color:var(--ink-2)}
.live b{font-family:var(--fm);font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.cert-list{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.cert-list li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.5}
.cert-list .mono{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cert .reward{font-size:16px;font-weight:700;color:var(--spot)}
.cert .small{font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.cert .stamp{top:14px;right:14px;margin-top:0;width:96px;height:96px;font-size:16px}

/* librarian mode */
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:18px 16px}
.admin{display:flex;flex-direction:column;gap:14px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.admin h2{font-size:22px;font-weight:900}
.admin h3{margin-top:6px;font-size:16px;font-weight:700;color:var(--spot)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1 / -1}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
.admin label{display:block;margin-bottom:4px;font-size:12.5px;color:var(--ink-2)}
.admin input,.admin select,.admin textarea{width:100%;padding:9px 11px;border:1px solid var(--field);border-radius:8px;background:#FFFFFF;font:inherit;font-size:15px;color:var(--ink)}
.admin textarea{min-height:66px;resize:vertical;line-height:1.5}
.admin label.check{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--ink)}
.admin label.check input{width:18px;height:18px;margin:0}
details.rxed{border:1px solid var(--rule);border-radius:10px;background:#FFFFFF;overflow:hidden}
details.rxed summary{cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;list-style:none}
details.rxed summary::-webkit-details-marker{display:none}
details.rxed summary .no{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--spot)}
details.rxed summary .sym{font-size:15px;font-weight:500}
details.rxed[open] summary{border-bottom:1px solid var(--rule);background:var(--spot-tint-2)}
details.rxed .body{padding:12px;display:flex;flex-direction:column;gap:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--field);background:#FFFFFF;color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap;line-height:1.3;font-size:14px}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--spot);border-color:var(--spot);color:#FFFFFF;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.bar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);padding:12px 0 calc(4px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--rule)}
.admin textarea.codes{min-height:150px;font-family:var(--fm);font-size:12.5px;white-space:pre}
@media (prefers-reduced-motion:reduce){.stamp,.live .dot{animation:none}}
</style>

<div id="app"></div>
<script id="rx-js">
(function(){

  var KEY = 'rx-book-progress-v1';
  var FONT_LINKS = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">';
  var RESET_FALLBACK = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

  var app = document.getElementById('app');

  var DATA = JSON.parse(document.getElementById('rx-data').textContent);
  var draft = null;                 // admin working copy
  var view = { screen: 'home', rxId: null, admin: false, open: {}, msg: {}, justDone: null };
  var caps = { artifact: null, canEdit: false };
  var progress = loadProgress();

  var ICON = {
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    next: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    ext: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function loadProgress(){ try { var s = localStorage.getItem(KEY); var p = s ? JSON.parse(s) : null; return (p && p.done) ? p : { done: {} }; } catch(e){ return { done: {} }; } }
  function saveProgress(){ try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch(e){} }
  function data(){ return view.admin && draft ? draft : DATA; }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function toDate(iso){ var d = iso ? new Date(iso) : new Date(); return isNaN(d) ? new Date() : d; }
  function fmtShort(iso){ var d = toDate(iso); return pad(d.getMonth() + 1) + '.' + pad(d.getDate()); }
  function fmtLong(iso){ var d = toDate(iso); return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()); }
  function fmtSlash(iso){ var d = toDate(iso); return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()); }
  function fmtTime(iso){ var d = toDate(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function norm(s){
    return String(s || '')
      .replace(/[！-～]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); })
      .replace(/[\s　]/g, '')
      .replace(/[《》「」『』:：\-–—.!?！？,，、。]/g, '')
      .toLowerCase();
  }
  function hasName(){ return !!(progress.name && String(progress.name).trim()); }
  function nowText(){ var d = new Date(); return fmtSlash(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function goalN(){ return Math.max(1, parseInt(data().event.goal, 10) || 1); }
  function doneCount(){ var n = 0; data().rx.forEach(function(r){ if (progress.done[r.id]) n++; }); return n; }
  function rxNum(id){ var m = String(id).match(/(\d+)\s*$/); return m ? m[1] : String(id); }
  function accentOf(d){ var a = d && d.event && d.event.accent; return /^#[0-9a-f]{6}$/i.test(a || '') ? a : DEFAULT_ACCENT; }
  function applyAccent(){ try { document.documentElement.style.setProperty('--spot', accentOf(data())); } catch(e){} }
  function capsule(on){
    return '<svg class="cap' + (on ? '' : ' off') + '" width="46" height="20" viewBox="0 0 46 20" aria-hidden="true">' +
      (on ? '<path class="half" d="M11 1h12v18H11a9 9 0 0 1 0-18z"/><path class="half2" d="M23 1h12a9 9 0 0 1 0 18H23z"/>' : '') +
      '<rect class="shell" x="1" y="1" width="44" height="18" rx="9"/><path class="mid" d="M23 1v18"/></svg>';
  }

  /* ---------- reader screens ---------- */
  function renderBand(){
    var d = data();
    return '<header class="band"><div class="wrap head">' +
      '<div class="head-top"><span class="lib">' + esc(d.lib) + '</span><span class="tag">閱讀藥局</span></div>' +
      '<h1>' + esc(d.event.name) + '</h1>' +
      '<p class="sub">' + esc(d.event.period) + '</p>' +
      (d.sample ? '<p class="sample">目前是範例書單。請館員到「館員模式」換成本館館藏後發布。</p>' : '') +
    '</div></header>';
  }

  function renderProgress(){
    var n = doneCount(), goal = goalN(), left = Math.max(0, goal - n), pills = '';
    for (var i = 0; i < goal; i++) pills += capsule(i < n);
    return '<section class="progress" aria-label="我的領藥進度">' +
      '<div class="txt"><span class="k">' + (hasName() ? esc(progress.name) + ' 的領藥進度' : '我的領藥進度') + '</span>' +
      '<span class="n">' + n + '<small> / ' + goal + ' 帖</small></span>' +
      '<span class="s">' + (left ? '再領 ' + left + ' 帖，就能換療程完成證明' : '療程完成，完成證明在上方。') + '</span></div>' +
      '<div class="caps' + (goal > 4 ? ' many' : '') + '">' + pills + '</div>' +
    '</section>';
  }

  function renderHome(){
    var d = data(), goal = goalN();
    var html = renderBand() + '<main class="wrap main">';
    if (!hasName()) html += renderRegister();
    else {
      if (doneCount() >= goal) html += renderCert();
      html += renderProgress();
    }
    html += '<div class="sec-head"><h2>請選擇最接近的症狀</h2><span>' + d.rx.length + ' 帖</span></div>';
    if (d.event.intro) html += '<p class="lead">' + esc(d.event.intro) + '</p>';
    html += '<div class="tickets">';
    d.rx.forEach(function(r){
      var when = progress.done[r.id];
      html += '<button class="ticket" type="button" data-act="open" data-id="' + esc(r.id) + '">' +
        '<span class="tno"><small>RX</small><b>' + esc(rxNum(r.id)) + '</b></span>' +
        '<span class="sym">' + esc(r.symptom) + '</span>' +
        '<span class="st">' + (when ? '<span class="mini-stamp">已領藥<small>' + esc(fmtShort(when)) + '</small></span>' : '<span class="go">看診' + ICON.next + '</span>') + '</span>' +
      '</button>';
    });
    html += '</div>';
    html += '<p class="note">集滿 ' + goal + ' 帖並完成領藥，就會出現「療程完成證明」。' + esc(d.event.reward) + '</p>';
    html += '</main>' + renderFoot();
    return html;
  }

  function renderRegister(){
    var m = view.msg.reg || null;
    if (view.pendingName) {
      return '<section class="reg" aria-labelledby="reg-title">' +
        '<div class="reg-band"><b id="reg-title">初診掛號</b><span>請確認姓名</span></div>' +
        '<div class="reg-body">' +
          '<p class="reg-confirm">掛號姓名<br><b>' + esc(view.pendingName) + '</b></p>' +
          '<p class="reg-help">掛號後就不能修改。這個名字會印在「療程完成證明」上，兌換獎勵時要和你的員工證或證件核對。</p>' +
          '<div class="reg-actions"><button class="btn-go" type="button" data-act="reg-confirm">確認掛號</button><button class="btn-out" type="button" data-act="reg-edit">修改</button></div>' +
        '</div></section>';
    }
    return '<section class="reg" aria-labelledby="reg-title">' +
      '<div class="reg-band"><b id="reg-title">初診掛號</b><span>第一次使用請先填寫</span></div>' +
      '<form class="reg-body" data-act="register" autocomplete="off">' +
        '<label for="reg-name">姓名</label>' +
        '<div class="inrow"><input id="reg-name" name="name" maxlength="20" autocomplete="name" placeholder="請填寫真實姓名" value="' + esc(view.nameDraft || '') + '" required>' +
        '<button class="btn-go" type="submit">掛號</button></div>' +
        '<div class="msg ' + (m ? m.kind : '') + '" aria-live="polite">' + (m ? esc(m.text) : '') + '</div>' +
        '<p class="reg-help">名字會印在「療程完成證明」上，兌換獎勵時要和你的員工證或證件核對。名字只存在你這支手機的瀏覽器裡，不會傳到任何地方。</p>' +
      '</form></section>';
  }

  function renderFoot(){
    var d = data();
    var showAdmin = caps.canEdit || location.hash === '#admin';
    var reset = '';
    if (view.screen === 'home' && (hasName() || doneCount())) {
      reset = view.confirmReset
        ? '<span class="reset-q">清除進度和掛號姓名？</span><button type="button" data-act="reset-yes">確定清除</button><button type="button" data-act="reset-no">取消</button>'
        : '<button type="button" data-act="reset">重設我的進度</button>';

    else inner = '<input id="' + id + '" type="' + (opts.type || 'text') + '" data-field="' + esc(path) + '" value="' + esc(value) + '"' + (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') + '>';

    html += '<h3>領藥碼與答案一覽</h3><p class="lead">領藥碼可以抄到紙卡、夾進包好的書裡；問答題的答案也列在這裡，方便櫃台查核。</p>' +
      '<textarea class="codes" id="codes" readonly>' + esc(codesText()) + '</textarea>' +
      '<div class="tools"><button class="btn" type="button" data-act="copy-codes">複製清單</button><button class="btn" type="button" data-act="copy-json">複製全部設定</button></div>' +
      '<div class="bar">' + (hosted() ? '<button class="btn primary" type="button" data-act="publish">發布</button>' : '<button class="btn primary" type="button" data-act="download">下載 index.html</button>') + '<button class="btn" type="button" data-act="preview">先看看讀者畫面</button>' +
      '<div class="msg ' + (view.msg.pub ? view.msg.pub.kind : '') + '" id="pubmsg" aria-live="polite">' + (view.msg.pub ? esc(view.msg.pub.text) : '') + '</div></div>' +
    '</section></main>';

  function renderAdminRx(r, i, total){
    var p = 'rx.' + i + '.';

  function codesText(){
    return draft.rx.map(function(r){ return r.id + '\t' + (r.challenge.type === 'quiz' ? '問答' : '領藥碼') + '\t' + r.challenge.answers.join(' / ') + '\t' + r.book.title; }).join('\n');
  }

  function setPath(obj, path, value){
    var parts = path.split('.'), o = obj;
    for (var i = 0; i < parts.length - 1; i++) { var k = parts[i]; if (o[k] == null) o[k] = /^\d+$/.test(parts[i + 1]) ? [] : {}; o = o[k]; }
    o[parts[parts.length - 1]] = value;
  }

  function nextId(){
    var used = {}; draft.rx.forEach(function(r){ used[r.id] = 1; });
    for (var n = 1; n < 1000; n++) { var id = 'RX-' + (n < 10 ? '0' + n : n); if (!used[id]) return id; }
    return 'RX-' + Date.now();
  }

  function buildDocument(state){
    var css = document.getElementById('rx-css').textContent;
    var js = document.getElementById('rx-js').textContent;
    var json = JSON.stringify(state, null, 1).replace(/</g, '\\u003c');
    var reset = RESET_FALLBACK;
    try { var s = document.head && document.head.querySelector('style'); if (s && /\[hidden\]/.test(s.textContent)) reset = s.textContent; } catch(e){}
    var content = '<title>神秘處方書</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + FONT_LINKS +
      '\n<style id="rx-css">' + css + '</style>\n' +
      '<script id="rx-data" type="application/json">\n' + json + '\n<\/script>\n' +
      '<div id="app"></div>\n' +
      '<script id="rx-js">' + js + '<\/script>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' + content + '</body></html>';
  }

  function setMsg(key, kind, text){ view.msg[key] = { kind: kind, text: text }; }
  function hosted(){ return !!(window.claude && typeof window.claude.use === 'function'); }

  function download(){
    /* self-hosted copy (GitHub Pages etc.): hand the librarian a complete index.html with the new settings */
    try {
      var blob = new Blob([buildDocument(draft)], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
      setMsg('pub', 'good', '已下載 index.html。到 GitHub 把舊的 index.html 換成這個檔案，幾分鐘後讀者就會看到新版。');
    } catch(e){
      setMsg('pub', 'bad', '這個瀏覽器無法下載。請按「複製全部設定」，把內容貼到 index.html 的 rx-data 區塊。');
    }
    render();
  }

  function publish(){
    setMsg('pub', '', '發布中…'); render();
    if (!caps.artifact) {
      setMsg('pub', 'bad', '這個瀏覽器沒有以頁面擁有者的帳號登入，無法發布。請用建立此頁面的帳號登入後再試；或按「複製全部設定」把內容貼給 Claude 請它更新。');
      render(); return;
    }
    try { sessionStorage.setItem('rx-book-admin-return', '1'); } catch(e){}
    caps.artifact.publish(buildDocument(draft)).then(function(){
      setMsg('pub', 'good', '已發布，頁面即將重新載入。'); render();
    }).catch(function(e){
      var code = e && e.code;
      try { sessionStorage.removeItem('rx-book-admin-return'); } catch(err){}
      if (code === 'conflict') setMsg('pub', '', '另一個人剛剛發布了新版本，頁面會重新載入成最新版。');
      else if (code === 'not_writer' || code === 'not_granted') { caps.artifact = null; setMsg('pub', 'bad', '你目前的帳號只能看、不能改這個頁面。請用建立此頁面的帳號登入。'); }
      else if (code === 'too_large') setMsg('pub', 'bad', '內容太大，請刪掉一些文字再試。');
      else if (code === 'rate_limited') setMsg('pub', 'bad', '發布太頻繁，請等一下再試。');
      else setMsg('pub', 'bad', '發布失敗（' + (code || '未知原因') + '），請再試一次。');
      render();
    });
  }

  function copyText(text, key){
    var ok = function(){ setMsg(key, 'good', '已複製。'); render(); };
    var fail = function(){ var ta = document.getElementById('codes'); if (ta) { ta.focus(); ta.select(); } setMsg(key, '', '無法自動複製，請長按文字框手動複製。'); render(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fail); else fail();
    } catch(e){ fail(); }
  }

  /* ---------- render & events ---------- */
  function render(){
    var html;
    applyAccent();
    if (view.admin) html = renderAdmin();
    else if (view.screen === 'rx') {
      var r = null; data().rx.forEach(function(x){ if (x.id === view.rxId) r = x; });
      html = r ? renderRx(r) : renderHome();
    } else html = renderHome();
    app.innerHTML = html;
    var dets = app.querySelectorAll('details.rxed');
    for (var i = 0; i < dets.length; i++) dets[i].addEventListener('toggle', function(e){ view.open[e.target.getAttribute('data-id')] = e.target.open; });
    if (view.admin) { var pm = document.getElementById('codes'); if (pm) pm.value = codesText(); }
  }

  app.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'); if (act === 'verify' || act === 'register') return;
    e.preventDefault();
    if (act === 'open') {
      if (!hasName()) {
        view.pendingName = null;
        setMsg('reg', 'bad', '請先填寫姓名完成掛號，就能看診。');
        render();
        var nameBox = document.getElementById('reg-name');
        if (nameBox) { nameBox.scrollIntoView({ block: 'center' }); nameBox.focus(); }
        return;
      }
      view.screen = 'rx'; view.rxId = el.getAttribute('data-id'); view.justDone = null; render(); window.scrollTo(0, 0);
    }
    else if (act === 'home') { view.screen = 'home'; view.rxId = null; view.justDone = null; render(); window.scrollTo(0, 0); }
    else if (act === 'reg-confirm') {
      if (view.pendingName) { progress.name = view.pendingName; progress.registeredAt = new Date().toISOString(); saveProgress(); }
      view.pendingName = null; view.nameDraft = ''; view.msg.reg = null; render(); window.scrollTo(0, 0);
    }
    else if (act === 'reg-edit') {
      view.pendingName = null; render();
      var nb = document.getElementById('reg-name'); if (nb) nb.focus();
    }
    else if (act === 'reset') { view.confirmReset = true; render(); }
    else if (act === 'reset-no') { view.confirmReset = false; render(); }
    else if (act === 'reset-yes') { progress = { done: {} }; saveProgress(); view.confirmReset = false; view.pendingName = null; view.nameDraft = ''; render(); window.scrollTo(0, 0); }
    else if (act === 'admin') { draft = clone(DATA); view.admin = true; view.msg.pub = null; render(); window.scrollTo(0, 0); }
    else if (act === 'admin-close') { view.admin = false; draft = null; view.screen = 'home'; render(); window.scrollTo(0, 0); }
    else if (act === 'preview') {
      /* apply the draft locally so the librarian sees the reader view; publish is still needed for readers */
      DATA = clone(draft); view.admin = false; view.screen = 'home'; view.msg.pub = null; render(); window.scrollTo(0, 0);
    }
    else if (act === 'add') {
      var id = nextId();
      draft.rx.push({ id: id, symptom: '', dose: '', course: '', caution: '', teaser: '', book: { title: '', author: '', call: '', shelf: '', note: '', link: '' }, challenge: { type: 'quiz', hint: '', answers: [] } });
      view.open[id] = true; render();
    }
    else if (act === 'del') { var i = +el.getAttribute('data-i'); draft.rx.splice(i, 1); render(); }
    else if (act === 'up' || act === 'down') {
      var k = +el.getAttribute('data-i'), j = act === 'up' ? k - 1 : k + 1;
      if (j < 0 || j >= draft.rx.length) return;
      var t = draft.rx[k]; draft.rx[k] = draft.rx[j]; draft.rx[j] = t; render();
    }
    else if (act === 'publish') publish();
    else if (act === 'download') download();
    else if (act === 'copy-codes') copyText(codesText(), 'pub');
    else if (act === 'copy-json') copyText(JSON.stringify(draft, null, 1), 'pub');
  });

  app.addEventListener('submit', function(e){
    var regForm = e.target.closest('form[data-act="register"]');
    if (regForm) {
      e.preventDefault();
      var box = regForm.querySelector('input[name="name"]');
      var name = String(box && box.value || '').replace(/\s+/g, ' ').trim();
      view.nameDraft = name;
      if (!name) { setMsg('reg', 'bad', '請填寫姓名。'); render(); var b1 = document.getElementById('reg-name'); if (b1) b1.focus(); return; }
      if (name.length > 20) { setMsg('reg', 'bad', '姓名最多 20 個字。'); render(); var b2 = document.getElementById('reg-name'); if (b2) b2.focus(); return; }
      view.pendingName = name; view.msg.reg = null; render();
      return;
    }
    var form = e.target.closest('form[data-act="verify"]'); if (!form) return;
    e.preventDefault();
    var id = form.getAttribute('data-id'), r = null; data().rx.forEach(function(x){ if (x.id === id) r = x; });
    if (!r) return;
    var input = form.querySelector('input[name="answer"]');
    var ni = norm(input && input.value);
    var ok = r.challenge.answers.some(function(a){ var na = norm(a); return na && (ni === na || (na.length >= 3 && ni.indexOf(na) >= 0)); });
    if (ok) {
      progress.done[r.id] = new Date().toISOString(); saveProgress(); view.msg[r.id] = null; view.justDone = r.id; render(); window.scrollTo(0, 0);
    } else {
      setMsg(r.id, 'bad', r.challenge.type === 'quiz' ? '答案不對，再找找看。提示就在上面的「領藥方式」。' : '領藥碼不對。請確認卡片上的代碼，大小寫不限。');
      render();
      var again = document.getElementById('ans-' + r.id); if (again) { again.value = input ? input.value : ''; again.focus(); }
    }
  });

  app.addEventListener('input', onField);
  app.addEventListener('change', onField);
  function onField(e){
    var el = e.target; var path = el.getAttribute && el.getAttribute('data-field'); if (!path || !draft) return;
    var v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') v = parseInt(el.value, 10) || 1;
    else if (/challenge\.answers$/.test(path)) v = el.value.split(/[,，、\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
    else v = el.value;
    setPath(draft, path, v);
    if (path === 'event.accent') applyAccent();
    if (e.type === 'change' && (/challenge\./.test(path) || /book\.title$/.test(path))) { var ta = document.getElementById('codes'); if (ta) ta.value = codesText(); }
    if (e.type === 'input' && /symptom$/.test(path)) { var det = el.closest('details.rxed'); var sym = det && det.querySelector('summary .sym'); if (sym) sym.textContent = el.value || '（尚未填寫症狀）'; }
  }

  /* ---------- boot ---------- */
  render();
  /* the certificate's clock keeps ticking, so a screenshot is easy to tell apart from the live page */
  setInterval(function(){ var c = document.getElementById('live-clock'); if (c) c.textContent = nowText(); }, 1000);
  window.addEventListener('hashchange', function(){ if (!view.admin) render(); });
  try { if (sessionStorage.getItem('rx-book-admin-return')) { sessionStorage.removeItem('rx-book-admin-return'); view.pendingAdminNote = true; } } catch(e){}

  (function lightUp(){
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    window.claude.use('user').then(function(user){
      if (!user) return false; return user.canEdit();
    }).then(function(can){
      caps.canEdit = !!can;
      return window.claude.use('artifact');
    }).then(function(art){
      caps.artifact = art || null;
      if (view.pendingAdminNote && caps.canEdit) { draft = clone(DATA); view.admin = true; setMsg('pub', 'good', '已發布最新版本。'); view.pendingAdminNote = false; }
      render();
    }).catch(function(){ render(); });
  })();
})();
</script>
